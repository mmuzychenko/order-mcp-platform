server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL}
    username: ${ORDER_DB_USER}
    password: ${ORDER_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI}
          audiences: ${ORDER_API_AUDIENCE:order-api}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    level: "%5p [corr=%X{correlationId:-}]"
